name: bootstrap-release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ hashFiles('.bootstrap/**') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish source and code-derived evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/release.tar.gz https://filebin.net/jonno-garage-20261017-a8f3/authentication.tar.gz
          mkdir -p /tmp/release /tmp/generated
          tar -xzf /tmp/release.tar.gz -C /tmp/release
          cp /tmp/release/generated/EDD.md /tmp/generated/EDD.md
          cp /tmp/release/generated/COMPARISON.md /tmp/generated/COMPARISON.md
          rm -rf /tmp/release/generated /tmp/release/.github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/release/. .
          git add -A && git commit -m "Publish V0.1 Garage-standard implementation" && git push origin HEAD:main
          code_sha=$(git rev-parse HEAD)
          mkdir -p generated
          CODE_SHA="$code_sha" python - <<'PY'
          import os, pathlib, re
          sha=os.environ['CODE_SHA']
          for name in ('EDD.md','COMPARISON.md'):
              text=(pathlib.Path('/tmp/generated')/name).read_text()
              text=re.sub(r'(\*\*(?:Evidence commit|Implementation evidence):\*\* `)[0-9a-f]+(`)', lambda m:m.group(1)+sha+m.group(2), text)
              (pathlib.Path('generated')/name).write_text(text)
          PY
          git add generated && git commit -m "Add code-derived design evidence"
          git tag -f v0.1.0
          git push origin HEAD:main && git push --force origin v0.1.0
